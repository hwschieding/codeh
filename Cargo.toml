[workspace]
resolver = "3"
members = [
    "cli",
    "cli-derive",
    "agent-core",
    "llm-abstract",
    "http-handler",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = { version = "0.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json"] }
